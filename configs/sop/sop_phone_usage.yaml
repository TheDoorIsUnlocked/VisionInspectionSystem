# 手机使用场景 SOP 配置
# 场景：拿起手机 -> 打电话 -> 放下手机
#
# ⚠️ 标定提醒（务必用「🎯 标定区域」工具按真机画面设置，否则步骤不会推进）：
#   - phone_table：手机平时放在桌面的位置（拿起/放下都以它为准）
#   - ear_region ：你打电话时手机/手到达的"耳边"位置（必须对准你的耳朵，否则"打电话"永远超时）
# 本示例不依赖专用模型：人在场用 COCO 通用模型(person)，拿起/放下/打电话用手部姿态(DWPose)。
# 如需识别具体物料（手机/盒/线），请训练专用模型并把下方 model.path 指向它。

sop:
  name: "手机使用场景SOP"
  version: "1.0"
  description: "检测人员拿起手机、打电话、放下手机的完整流程"
  
  # 全局设置
  settings:
    detectionMode: "pose_based"  # 使用姿态检测模式
    confidenceThreshold: 0.6
    stableFrames: 3
    timeoutSeconds: 30
  
  # 区域定义（坐标需在「🎯 标定区域」工具里按真机画面重新标定）
  regions:
    phone_table:
      x1: 200
      y1: 400
      x2: 350
      y2: 550
      name: "手机放置区"
      description: "手机放置的桌面区域（拿起=手离开此区；放下=手到达此区）"
      color: "#4CAF50"
      
    ear_region:
      x1: 450
      y1: 150
      x2: 550
      y2: 250
      name: "耳边区域"
      description: "打电话时手/手机应到达的耳边位置（务必对准你的耳朵）"
      color: "#2196F3"
      
    face_region:
      x1: 400
      y1: 100
      x2: 600
      y2: 300
      name: "面部区域"
      description: "检测人脸位置"
      color: "#FF9800"
  
  # 步骤定义
  steps:
    # 步骤1: 等待状态
    - id: "idle"
      name: "等待"
      description: "等待人员开始操作"
      timeout: 30
      transitions: ["pickup_phone"]
      detection:
        method: "person_present"
        min_confidence: 0.6
        description: "检测到人员在场（COCO person 类别）"
    
    # 步骤2: 拿起手机
    - id: "pickup_phone"
      name: "拿起手机"
      description: "从桌面拿起手机"
      timeout: 5
      transitions: ["make_call"]
      detection:
        method: "hand_action"
        action: "pickup"
        hand: "any"
        from_region: "phone_table"
        target_object: "cell phone"   # 辅助判定：手拿着 cell phone 离开 phone_table 即视为拿起
        min_confidence: 0.6
        stable_frames: 3
        description: "手曾位于手机放置区且现已离开，或检测到手拿着手机离开放置区"
    
    # 步骤3: 打电话
    - id: "make_call"
      name: "打电话"
      description: "将手机放到耳边打电话"
      timeout: 15
      transitions: ["put_down_phone"]
      detection:
        method: "hand_in_region"
        hand: "any"
        region: "ear_region"
        min_confidence: 0.6
        stable_frames: 3
        description: "手在耳边区域稳定停留（ear_region 须对准耳朵）"
    
    # 步骤4: 放下手机
    - id: "put_down_phone"
      name: "放下手机"
      description: "将手机放回桌面"
      timeout: 5
      transitions: ["complete"]
      detection:
        method: "hand_action"
        action: "putdown"
        hand: "any"
        to_region: "phone_table"
        target_object: "cell phone"   # 辅助判定：手拿着 cell phone 进入 phone_table 即视为放下
        min_confidence: 0.6
        stable_frames: 3
        description: "手将手机放回放置区"
    
    # 步骤5: 完成
    - id: "complete"
      name: "完成"
      description: "手机使用流程完成"
      timeout: 2
      transitions: ["idle"]
      detection:
        method: "time_elapsed"
        duration_ms: 1000
        description: "等待1秒后回到初始状态"
  
  # 违规检测规则
  violations:
    - id: "phone_not_picked"
      name: "未拿起手机"
      description: "在规定时间内没有拿起手机"
      severity: "warning"
      
    - id: "call_too_short"
      name: "通话时间过短"
      description: "通话时间少于1秒"
      severity: "warning"
      
    - id: "phone_not_returned"
      name: "未放回手机"
      description: "没有将手机放回指定位置"
      severity: "error"
      
    - id: "wrong_hand_usage"
      name: "错误的手"
      description: "使用了不允许的手操作"
      severity: "warning"
  
  # 关键点配置
  keypoints:
    required:
      - "LeftWrist"
      - "RightWrist"
      - "Nose"
      - "LeftEar"
      - "RightEar"
    
  # 可视化配置
  visualization:
    show_regions: true
    show_keypoints: true
    show_skeleton: true
    show_tracking_id: true
    region_alpha: 0.3
    keypoint_radius: 5
